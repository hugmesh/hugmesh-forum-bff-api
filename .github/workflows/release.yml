# ─────────────────────────────────────────────────────────────────────────────
# Release: build + publish the container image to GHCR.
#
# `workflow_dispatch` only (no `push`/`tags`): this never runs on its own. A human
# adds a push/tag trigger once the org is ready to cut real releases.
#
# RUNNER. `runs-on` reads the repository variable RUNS_ON (a JSON array of labels,
# e.g. ["self-hosted","Linux","X64"]) and falls back to github-hosted
# ubuntu-latest when it is unset. It used to ask for the label `hugmesh-x86`, which
# no runner carries, so every dispatch sat in `queued` until GitHub cancelled it
# (runs 37682970170 and the 25 CI runs before it). That label is retired; see
# .github/SELF_HOSTED_RUNNER.md.
#
# WHERE THE PRIVATE MAVEN DEPENDENCIES COME FROM. The image build resolves
# net.hugmesh:hugmesh-parent / hugmesh-commons / hugmesh-build-config from the
# GitHub Packages Maven registries of the hugmesh org
# (https://maven.pkg.github.com/hugmesh/<repo>), through
# .github/maven-ci-settings.xml. That registry needs a credential even to READ,
# and the automatic GITHUB_TOKEN of THIS repository cannot read another
# repository's package unless that package lists this repository under
# "Manage Actions access". The read credential is therefore its own value:
#   secrets.PACKAGES_READ_TOKEN  (a classic PAT with read:packages) when set,
#   secrets.GITHUB_TOKEN         otherwise (works once the access grant exists).
# The "Preflight - cross-repo package read" step probes the registries with that
# credential BEFORE the slow image build and reports an authorisation failure as
# an authorisation failure, not as "the upstream is not published".
#
# NOTHING IS PUBLISHED TO MAVEN FROM HERE. This workflow pushes a container image
# only; the jar built inside the image is never deployed.
#
# TAGS. Every run pushes ghcr.io/hugmesh/hugmesh-forum-bff-api:<12-char sha>.
# The moving `latest` tag is pushed ONLY when the run is on `main`, so a dispatch
# from a work branch can never overwrite what `latest` points at.
#
# The repo-root settings.xml (GitLab registry) is untouched: the local compose
# lane (hugmesh-generator tests/stack, m2-bootstrap) still builds this Dockerfile
# with its defaults.
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/hugmesh/hugmesh-forum-bff-api

jobs:
  build-and-push:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # This job builds a container image, so a runner without a usable Docker
      # daemon can only fail obscurely inside setup-buildx.
      - name: Preflight - Docker
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::no docker on this runner; the image build cannot run."
            exit 1
          fi
          if ! docker version >/dev/null 2>&1; then
            echo "::error::docker is on PATH but the daemon is unreachable (permissions on /var/run/docker.sock, or it is not running)."
            exit 1
          fi
          echo "Docker is usable."

      - name: Preflight - cross-repo package read
        env:
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN != '' }}
        run: |
          set -uo pipefail
          if [ "${HAS_PACKAGES_READ_TOKEN}" = "true" ]; then
            echo "read credential: secrets.PACKAGES_READ_TOKEN (operator-held PAT)"
          else
            echo "read credential: the automatic secrets.GITHUB_TOKEN. It can only read an"
            echo "upstream package that lists THIS repository under 'Manage Actions access'."
          fi
          rc=0
          for upstream in hugmesh-build-config hugmesh-parent hugmesh-commons; do
            url="https://maven.pkg.github.com/hugmesh/${upstream}/net/hugmesh/${upstream}/maven-metadata.xml"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -u "${UPSTREAM_PACKAGES_ACTOR}:${UPSTREAM_PACKAGES_TOKEN}" "${url}" || echo 000)
            case "${code}" in
              200)
                echo "  readable    hugmesh/${upstream}"
                ;;
              401|403)
                echo "::error::CANNOT AUTHENTICATE to hugmesh/${upstream} (HTTP ${code}). This is NOT 'the upstream is unpublished': the credential cannot read that repository's Maven registry. Fix: add this repository under that package's 'Manage Actions access', or set the PACKAGES_READ_TOKEN secret to a classic PAT with read:packages."
                rc=1
                ;;
              404)
                echo "::error::NOT READABLE at hugmesh/${upstream} (HTTP 404). Two causes look identical: (a) nothing is published to that registry yet (chain order: build-config, parent, commons), or (b) it IS published and this credential cannot see it, because GitHub masks an unauthorised read of a private package as 404. Look at the package page before re-publishing anything."
                rc=1
                ;;
              *)
                echo "::error::unexpected HTTP ${code} from hugmesh/${upstream}. Not classified - do not assume 'unpublished'."
                rc=1
                ;;
            esac
          done
          exit ${rc}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          tags="${IMAGE}:${GITHUB_SHA::12}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "will push:"; echo "${tags}"

      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          secrets: |
            packages_read_token=${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          build-args: |
            MAVEN_SETTINGS=.github/maven-ci-settings.xml
            UPSTREAM_PACKAGES_ACTOR=${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
