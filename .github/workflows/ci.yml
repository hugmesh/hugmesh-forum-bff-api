# ─────────────────────────────────────────────────────────────────────────────
# GitHub-side COMPILE + TEST + SCA workflow.
#
# READ THIS FIRST — NOTHING IN THIS FILE HAS EVER EXECUTED. Measured 2026-09-17
# against github.com/hugmesh/hugmesh-forum-bff-api, via the REST API:
#
#   * 25 of 25 `CI` runs since 2026-07-30 ended `cancelled`. Not one was ever
#     assigned a runner — `runner_name` is empty and `steps` is empty on every
#     job. Run 33946257559 queued at 2026-09-05T05:04:57Z and was cancelled at
#     2026-09-06T05:04:57Z, exactly 24h later: GitHub's queue limit for a job no
#     runner picks up. (Three shorter cancellations are `concurrency:` below
#     superseding an older commit, not runs that did anything.)
#   * GET /repos/hugmesh/hugmesh-forum-bff-api/actions/runners -> total_count 0.
#     No self-hosted runner carrying the `hugmesh-x86` label is registered here.
#   * github-HOSTED runners are not an escape hatch on this account: they die in
#     3-5s with "The job was not started because recent account payments have
#     failed or your spending limit needs to be increased" (reproduced the same
#     day on hugmesh/hugmesh-generator run 35277167203, labels [ubuntu-latest]).
#   * GET /repos/hugmesh/hugmesh-forum-bff-api/branches/main/protection -> 403
#     "Upgrade to GitHub Pro or make this repository public to enable this
#     feature". On the current plan a required status check on a PRIVATE repo
#     cannot be configured AT ALL — so nothing here can be made merge-blocking
#     by editing this file.
#
# An earlier version of this header asserted that this workflow "makes the
# compile + test a REQUIRED, merge-blocking GitHub status check". It does not,
# and it never did: every PR in this repo merged with this workflow contributing
# nothing. That claim is corrected here rather than deleted, because a CI file
# that overstates its own coverage is exactly how a gap survives a review — the
# reader sees a plausible gate and stops looking. Tracked, with the API evidence,
# on hugmesh/hugmesh-forum-bff-api#2.
#
# WHY THIS FILE EXISTS ANYWAY
# Merges happen on GitHub (`gh pr merge`), but the test pipeline runs on the
# in-cluster GitLab PULL MIRROR (.gitlab-ci.yml) — and GitHub never waits for
# GitLab. So a PR can merge onto a BROKEN main and GitLab only fails afterwards.
# That is exactly how forum-bff main went non-compiling once (a static-analysis
# cleanup dropped a `ClientResponse` import; the build failed only post-merge on
# GitLab; PR #34 fixed it). This workflow is the intended remedy, waiting on the
# PREREQS below to become real.
#
# RUNNER — GitHub-hosted `ubuntu-latest`, written literally (changed 2026-10-21).
# Both jobs run on `pull_request`, and the org is going public: a self-hosted
# runner must never take pull-request jobs, because a fork's PR runs the fork's
# own copy of this file. So this workflow never reads `vars.RUNS_ON` and never
# names a self-hosted label. Publishing (release.yml) is the only workflow that
# may use the local runner, and only for main, v* tags and manual dispatch.
# Hosted runners have Docker (Testcontainers in `build`, the Dependency-Check
# image in `sca`), but no route to the tailnet GitLab registry. So `build` reads
# the net.hugmesh libraries from GitHub Packages through
# .github/maven-ci-settings.xml whenever the PACKAGES_READ_TOKEN secret reaches
# the run (pushes to main and same-repo PRs; release.yml uses the same file).
# Without that secret (a fork PR, or the secret unset) it falls back to the
# GitLab settings.xml below and fails to resolve the parent POM: a fork PR
# cannot run `build` green on GitHub, and that is expected.
#
# HISTORICAL (before 2026-10-21): this file asked for `[self-hosted,
# hugmesh-x86]` so it could reach the GitLab registry over the tailnet. No
# runner ever carried that label, so every run queued for 24h and was
# cancelled, as measured above. The PREREQS below describe that old plan;
# items 1 and 2 no longer apply to these jobs.
#
# PREREQS (one-time; ALL FOUR are operator-held — none can be set from a PR):
#   1. Register a self-hosted runner (labels: self-hosted, hugmesh-x86) on the
#      tailnet with Docker available (mirrors the GitLab privileged shell
#      runner). Until this exists, both jobs below queue for 24h and are
#      cancelled, which is the measured status quo.
#   2. Add repo/org SECRETS that map to the settings.xml ${env.*} placeholders:
#        GITLAB_MAVEN_TOKEN  -> a read-scoped token for the GitLab group Maven registry
#        GITLAB_API_V4_URL   -> the in-cluster GitLab API v4 URL (e.g. https://gitlab.<tailnet>/api/v4)
#        GITLAB_GROUP_ID     -> the HugMesh GitLab group id
#      REQUIRED for `sca`: NVD_API_KEY (org secret, visibility all) -> the NVD API
#      key OWASP Dependency-Check needs to download the NVD feed. Without it — or
#      with an EMPTY stored value — the scan ends in exit 13; a NEW key fails the
#      same way ("Invalid API Key") until the activation link in NVD's email is
#      clicked. See hugmesh-generator docs/NVD-API-KEY.md.
#   3. Lift the GitHub plan/billing block: private-repo branch protection needs
#      GitHub Pro (or Team), and github-hosted minutes need the payment failure
#      cleared. Either that, or make the repo public.
#   4. THEN branch protection on `main`: require the "build" check before merge
#      (Settings → Branches → Protect main → Require status checks → "build").
#      `sca` is deliberately NOT a candidate for that list — see its comment.
#
# PUBLIC-REPO SAFETY (added 2026-10-21, before the org goes public)
# On a PUBLIC repo anyone can open a pull request from a fork, and the
# `pull_request` trigger below then runs that fork's code (its pom.xml, its
# tests, its scripts). Both jobs therefore name a GitHub-hosted runner as a
# literal `ubuntu-latest`: no expression, no repository variable, no
# self-hosted label. scripts/ci-parity-guard.sh fails the build if a workflow
# that pull requests can start ever names anything else.
#
# That is one layer, not the security boundary: for `pull_request` GitHub reads
# the workflow file from the pull request itself, so a fork can edit this file
# and point `runs-on` straight at a self-hosted label. What actually keeps fork
# code off the operator's host is organisation settings, which no file here can
# set:
#   * the runner group that holds the self-hosted runners must NOT allow public
#     repositories (`allows_public_repositories: false`; measured false on the
#     org's only group, "Default", on 2026-10-21), and
#   * "Approval for running fork pull request workflows from contributors" must be
#     "Require approval for all external contributors" (measured on 2026-10-21 as
#     first-time contributors only).
# Keep both.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel a superseded run when a PR is updated, so the gate always reflects the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub-hosted, never self-hosted: this job runs on pull_request (see the RUNNER note above).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (matches the GitLab CI eclipse-temurin:25 image)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # `mvnw verify` compiles main + test sources AND runs the suite. The compile phase
      # alone catches the broken-import class that slipped through before; `verify` also
      # runs the Testcontainers full-context tests against the host Docker daemon (Ryuk
      # disabled — the runner reaps its own short-lived containers, matching .gitlab-ci.yml).
      # settings.xml resolves the private hugmesh-parent/commons from the GitLab group
      # Maven registry via the secrets mapped to its ${env.*} placeholders (NO secret in git).
      # Pure-text cross-check of the constants the Makefile, this workflow, the
      # Dockerfile and .gitlab-ci.yml must agree on (JDK major, SCA CVSS gate).
      # Costs milliseconds and cannot flake; runs BEFORE the build so a drifted
      # pin is the first thing in the log rather than the last. The same script
      # runs first in .gitlab-ci.yml's `test` job, which is the pipeline that
      # actually executes today.
      - name: CI parity guard (constants must not drift)
        run: bash scripts/ci-parity-guard.sh

      # The release.yml version guard (which ref may publish which image tags) is plain
      # bash; its tests cost milliseconds and need no network.
      - name: Release version guard tests
        run: bash scripts/test-release-version.sh

      # release.yml's own signref check, overwrite guard, floating-tag re-check, digest check
      # and GitHub Release flags, executed per channel with docker and gh stubbed. Stdlib only.
      - name: Release workflow tests
        run: python3 scripts/test-release-workflow.py

      # Settings selection mirrors the Dockerfile: GitHub Packages when the read token is
      # present, otherwise the legacy GitLab settings.xml (which a hosted runner cannot reach).
      - name: Build + test (merge gate)
        env:
          CI_JOB_TOKEN: ${{ secrets.GITLAB_MAVEN_TOKEN }}
          CI_API_V4_URL: ${{ secrets.GITLAB_API_V4_URL }}
          GITLAB_GROUP_ID: ${{ secrets.GITLAB_GROUP_ID }}
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
          TESTCONTAINERS_RYUK_DISABLED: "true"
          MAVEN_OPTS: "-Dapi.version=1.43"
        run: |
          set -euo pipefail
          settings=settings.xml
          if [ -n "${UPSTREAM_PACKAGES_TOKEN}" ]; then
            settings=.github/maven-ci-settings.xml
          fi
          echo "maven settings: ${settings}"
          ./mvnw -B -s "${settings}" clean verify

  # ---------------------------------------------------------------------------
  # phpbb-smoke — this BFF against a REAL throwaway phpBB 3.3.11 with the
  # hugmesh/forumapi extension (hugmesh-forum-bff-api#1). The test
  # (src/test/java/net/hugmesh/forumbff/smoke/PhpbbLiveSmokeTest.java, JUnit tag
  # `phpbb-smoke`) starts Postgres + the published ghcr.io/hugmesh/hugmesh-forum-api
  # image, pinned by digest, through Testcontainers, then drives /bff/forum/** with
  # phpbb.enabled=true and external.forum.enabled=true. `build` excludes the tag;
  # the `phpbb-smoke` Maven profile runs only it. Same settings selection as `build`.
  # Separate job so a phpBB-side failure is named as such and never hides a unit
  # failure (or the reverse).
  # ---------------------------------------------------------------------------
  phpbb-smoke:
    name: phpbb-smoke (live phpBB 3.3.11 + hugmesh/forumapi)
    # GitHub-hosted, never self-hosted: this job runs on pull_request (see the RUNNER note above).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (matches the GitLab CI eclipse-temurin:25 image)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Live phpBB smoke test
        env:
          CI_JOB_TOKEN: ${{ secrets.GITLAB_MAVEN_TOKEN }}
          CI_API_V4_URL: ${{ secrets.GITLAB_API_V4_URL }}
          GITLAB_GROUP_ID: ${{ secrets.GITLAB_GROUP_ID }}
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
          TESTCONTAINERS_RYUK_DISABLED: "true"
          MAVEN_OPTS: "-Dapi.version=1.43"
        run: |
          set -euo pipefail
          settings=settings.xml
          if [ -n "${UPSTREAM_PACKAGES_TOKEN}" ]; then
            settings=.github/maven-ci-settings.xml
          fi
          echo "maven settings: ${settings}"
          ./mvnw -B -s "${settings}" clean test -Pphpbb-smoke

  # ---------------------------------------------------------------------------
  # sca — OWASP Dependency-Check, the GitHub-side port of `.gitlab-ci.yml`'s
  # `pentest:sca` (which `extends: .pentest-sca` from the generator's
  # tests/pentest/ci/pentest-stage.gitlab-ci.yml). Closes the SCA half of the CI
  # parity gap in hugmesh/hugmesh-forum-bff-api#2.
  #
  # DELIBERATELY NON-BLOCKING. `continue-on-error: true` here is the exact
  # analogue of `allow_failure: true` on `pentest:sca` in .gitlab-ci.yml. That
  # posture is policy, not an oversight, and this port does not change it: making
  # SCA merge-blocking is an operator decision, recorded as a numbered box on
  # issue #2. Because a failing continue-on-error job still renders as a green
  # check, the last step writes the verdict to the run summary — a non-blocking
  # failure that nobody can read is the same as no scan at all.
  #
  # PARITY NOTES — this is a port, so it keeps the GitLab job's choices even
  # where a fresh design would differ:
  #   * `owasp/dependency-check:latest` is unpinned, matching `.pentest-sca`'s
  #     `image:`. Pinning it here alone would make the two scans diverge silently.
  #   * `--failOnCVSS 7` is `.pentest-sca`'s SCA_FAIL_CVSS default, which this
  #     repo's thin `pentest:sca` job does not override.
  #   * `needs: [build]` reproduces GitLab's stage ordering (test -> ... ->
  #     pentest): a red test stage stops the pipeline before SCA there too.
  #     TRADEOFF, stated because it bites TODAY: a red — or cancelled — `build`
  #     SKIPS this job entirely, and a skipped job writes no
  #     $GITHUB_STEP_SUMMARY, so the "DID NOT RUN, treat it as NO COVERAGE" net
  #     below is unreachable in exactly the scenario that occurs on every run
  #     right now (build cancelled at the 24h queue limit). Dropping `needs:`
  #     would fix that but would stop mirroring GitLab's stage order; it is a
  #     numbered box on issue #2, not a silent choice.
  #   * The GitLab job also runs on `$CI_PIPELINE_SOURCE == "schedule"`; there is
  #     no schedule trigger on this workflow, so that leg is not ported.
  #   * NOT PORTED — `artifacts.reports.sast:` (pentest-stage.gitlab-ci.yml:90-91)
  #     maps the SARIF into GitLab's MR security widget, which is the one thing
  #     that makes an allow_failure scan readable per-finding without opening the
  #     raw log. The Actions analogue is `github/codeql-action/upload-sarif`, and
  #     on a PRIVATE repo that needs GitHub Advanced Security — i.e. the SAME
  #     plan block as branch protection above. So the SARIF is generated
  #     (`--format SARIF`) and uploaded only as a plain build artifact; the
  #     findings do not surface in a code-scanning view. Tracked on issue #2.
  # The one intentional deviation: `--user $(id -u):$(id -g)`. GitLab runs this
  # image as its own user inside a job container it then throws away; this was
  # written for a PERSISTENT self-hosted runner workspace, where a root-owned
  # reports/ or .nvd-cache/ would break the next actions/checkout. It is kept on
  # the hosted runner too: harmless there, and the upload step can read the files.
  # ---------------------------------------------------------------------------
  sca:
    name: sca (OWASP Dependency-Check, non-blocking)
    needs: [build]
    continue-on-error: true
    # GitHub-hosted, never self-hosted: this job runs on pull_request (see the RUNNER note above).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Say WHY the scan cannot run, and fail — never report success having
      # scanned nothing. The whole point of the job is the finding it produces;
      # a silent skip is indistinguishable from a clean bill of health, and this
      # job is non-blocking, so a skip would be invisible twice over.
      - name: Require Docker (say WHY, never silently skip)
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            echo "FATAL: no docker on this runner. The SCA job runs the"
            echo "       owasp/dependency-check image, so a runner without Docker"
            echo "       CANNOT scan anything. Register a runner matching the"
            echo "       GitLab privileged x86 shell runner, or drop this job."
            exit 1
          fi
          if ! docker version >/dev/null 2>&1; then
            echo "FATAL: docker is on PATH but the daemon is unreachable"
            echo "       (permissions on /var/run/docker.sock, or it is not running)."
            echo "       No scan can run here."
            exit 1
          fi

      # Month-keyed so the NVD feed re-syncs monthly instead of on every run,
      # mirroring the GitLab job's `nvd-cache-$CI_COMMIT_REF_SLUG-$(date +%Y%m)`.
      - name: Compute the NVD feed cache key
        id: nvd
        run: echo "month=$(date -u +%Y%m)" >> "$GITHUB_OUTPUT"

      - name: Restore/save the NVD feed cache
        uses: actions/cache@v4
        with:
          path: .nvd-cache
          key: nvd-cache-${{ steps.nvd.outputs.month }}
          restore-keys: |
            nvd-cache-

      # The NVD API key is REQUIRED in practice: keyless, NVD throttles the feed
      # download and Dependency-Check dies with exit 13 and only "[ERROR] Unable to
      # continue dependency-check analysis." in the log — which the summary below
      # used to report as a CVSS finding. An org secret stored from an EMPTY stdin
      # (`gh secret set` in a non-interactive shell) is indistinguishable from an
      # unset one here, and both are caught by this step.
      - name: Require the NVD_API_KEY org secret (say WHY, never a bare exit 13)
        id: nvdkey
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          key="$(printf '%s' "${NVD_API_KEY:-}" | tr -d '[:space:]')"
          if [ -z "${key}" ]; then
            echo "::error::NVD_API_KEY org secret is empty or unset — OWASP Dependency-Check needs an activated NVD API key (request: https://nvd.nist.gov/developers/request-an-api-key). See hugmesh-generator docs/NVD-API-KEY.md."
            echo "missing=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "missing=0" >> "$GITHUB_OUTPUT"

      - name: OWASP Dependency-Check
        id: scan
        env:
          # REQUIRED (checked by the step above). Passed in a private property
          # file (nvd.api.key=...), never on docker's argv.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          SCA_SCAN_DIR: "."
          SCA_PROJECT: hugmesh-forum-bff-api
          SCA_FAIL_CVSS: "7"
        run: |
          set -uo pipefail
          mkdir -p .nvd-cache reports/sca
          # 0600 property file under RUNNER_TEMP, outside the workspace (never an
          # artifact); the container runs as this same uid (--user), so it can
          # read it through the read-only mount.
          props="$(mktemp "${RUNNER_TEMP:-/tmp}/nvd.XXXXXX")"
          chmod 600 "${props}"
          printf 'nvd.api.key=%s\n' "$(printf '%s' "${NVD_API_KEY}" | tr -d '[:space:]')" > "${props}"
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${props}:/run/secrets/nvd.properties:ro" \
            -w /workspace \
            --entrypoint "" \
            owasp/dependency-check:latest \
            /usr/share/dependency-check/bin/dependency-check.sh \
              --project "${SCA_PROJECT}" \
              --scan "${SCA_SCAN_DIR}" \
              --out "reports/sca" \
              --data ".nvd-cache" \
              --failOnCVSS "${SCA_FAIL_CVSS}" \
              --enableExperimental \
              --format HTML --format SARIF --format JSON \
              --propertyfile /run/secrets/nvd.properties 2>&1 | tee reports/sca/dependency-check.log
          rc=${PIPESTATUS[0]}
          rm -f "${props}"
          set -e
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          exit "${rc}"

      - name: Upload the SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            reports/sca/dependency-check-report.html
            reports/sca/dependency-check-report.sarif
            reports/sca/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 30

      # A job marked continue-on-error renders as a PASSING check even when it
      # failed, so the verdict has to be written somewhere a human actually looks.
      - name: Report the SCA verdict
        if: always()
        env:
          SCAN_RC: ${{ steps.scan.outputs.rc }}
          KEY_MISSING: ${{ steps.nvdkey.outputs.missing }}
        run: |
          set -euo pipefail
          rc="${SCAN_RC:-}"
          {
            echo '## OWASP Dependency-Check (SCA)'
            echo
            log=reports/sca/dependency-check.log
            if [ "${KEY_MISSING:-}" = "1" ]; then
              echo '**DID NOT RUN — the `NVD_API_KEY` org secret is empty or unset.**'
              echo 'OWASP Dependency-Check needs an activated NVD API key to download the'
              echo 'NVD feed. Request one at https://nvd.nist.gov/developers/request-an-api-key,'
              echo 'click the activation link in NVD'"'"'s email, then set the org secret'
              echo '(an empty stdin to `gh secret set` stores an EMPTY secret without an'
              echo 'error). See hugmesh-generator `docs/NVD-API-KEY.md`. NO COVERAGE.'
            elif [ -z "${rc}" ]; then
              echo '**DID NOT RUN.** The scan step reported no exit code, so this'
              echo 'job scanned nothing. Treat it as NO COVERAGE, not as a pass.'
            elif [ "${rc}" = "0" ]; then
              echo '**PASS** — no dependency finding at or above CVSS 7.'
            elif [ -f "${log}" ] && grep -q 'Invalid API Key' "${log}"; then
              echo "**FAIL (exit ${rc}) — NVD refused the API key.** A NEW key works only"
              echo 'after you click the activation link in NVD'"'"'s email (allow a few minutes);'
              echo 'an invalid key looks the same. This is NOT a finding: nothing was scanned.'
              echo 'See hugmesh-generator `docs/NVD-API-KEY.md`.'
            elif [ -f "${log}" ] && grep -Eq 'Error updating the NVD Data|NvdApiRetryExceededException|Unable to continue dependency-check analysis' "${log}"; then
              echo "**FAIL (exit ${rc}) — the NVD feed update failed.** Is NVD_API_KEY set"
              echo 'and activated? This is NOT a finding: nothing was scanned.'
              echo 'See hugmesh-generator `docs/NVD-API-KEY.md`.'
            else
              echo "**FAIL (exit ${rc})** — Dependency-Check reported a finding at or"
              echo 'above CVSS 7, or the scan itself errored.'
              echo
              echo 'This job is `continue-on-error: true`, mirroring `allow_failure: true`'
              echo 'on `pentest:sca` in `.gitlab-ci.yml`, so it does NOT block the merge.'
              echo 'Open `dependency-check-report.html` in this run'"'"'s artifacts.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
