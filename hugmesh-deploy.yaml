# hugmesh-deploy.yaml — per-repo deploy descriptor (Phase 6 catalog). RENAMED from
# the pre-rebrand `snapdragon-deploy.yaml` via `git mv`, so history follows. This
# was the LAST repo in the org still shipping the legacy spelling; the header above
# has read `hugmesh-deploy.yaml` since an earlier content sweep, and only the
# filename lagged.
#
# WHY THE RENAME IS SAFE NOW. The header this replaced argued the name had to stay
# literal because the catalog's scmProvider matches on an exact filename. That
# stopped being true when the discovery hole was fixed: BOTH catalog generators
# (hugmesh-generator specs/cluster/apps/13-service-catalog.yaml and
# templates/apps/13d-brand-repos.yaml.hbs) now carry a `hugmesh-deploy.yaml` filter
# entry alongside the LEGACY_COMPAT `snapdragon-deploy.yaml` one, and ArgoCD ORs
# across `filters` entries — so this repo is matched under either spelling and stays
# discoverable across the rename. Dropping the legacy entries is a separate,
# deliberately operator-gated follow-up.
#
# COUPLED (other repo): hugmesh-generator specs/cluster/catalog/adopters.yaml
# registers this repo's descriptor BY NAME, and stage 5 of
# scripts/validate-catalog-discovery.sh reads this repo's root tree and fails on a
# mismatch. That row must be flipped to `hugmesh-deploy.yaml` in the same window as
# this rename, or the generator's lint:catalog-descriptor-discovery job reports
# registry drift. Discovery itself is unaffected either way.
#
# Discovered by the catalog ApplicationSet (hugmesh-generator
# specs/cluster/apps/13-service-catalog.yaml): its scmProvider gitea generator
# scans the in-cluster Forgejo org for repos carrying THIS file + a `deploy/`
# kustomize dir and generates one ArgoCD Application (source path: deploy/).
#
# DUAL-HOME / SHIPS DARK: the central manifest still lives at
# hugmesh-generator specs/cluster/manifests/forum-bff-api/ and remains the
# authoritative source today. This file + deploy/ are a Forgejo-cutover PILOT:
# the live GitHub-rooted ArgoCD ignores it, and the (currently unseeded) Forgejo
# catalog matches nothing, so it changes nothing running. deploy/ is a verbatim
# copy of the central manifest — keep the two in sync until cutover.
name: hugmesh-forum-bff-api          # Application name
namespace: hugmesh-backend        # target k8s namespace (existing tier ns) — left
                                      # unchanged, real cluster namespace (see safety notes)
image: hugmesh-systems/forum-bff-api # image repo (tag pinned in deploy/ kustomize)
port: 8080
replicas: 1
# Gateway route the admin/BFF seeds into the routing DB (Phase 2 core). The forum
# BFF is ClusterIP-only and reachable solely via the fe-gateway's same-origin
# /bff/forum/** route, which enforces ROLE_FORUM from the route DB (with the
# admin-only /bff/forum/admin/** and derived /bff/forum/moderation/** rows layered
# on top). It is the SINGLE browser->phpBB path.
route:
  gateway: hugmesh-fe-gateway
  path: /bff/forum/**
  stripPrefix: 0
