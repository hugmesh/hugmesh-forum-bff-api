apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hugmesh-backend
resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
# First-party images pull from the in-cluster GitLab container registry
# (registry.hugmesh.systems = the GitLab chart's hosts.domain default; project
# path = <group>/<repo>). The CI in each repo pushes :<branch> + :<sha>; we track
# the moving :main here for dev. Pulls need the gitlab-registry imagePullSecret
# (ESO-materialized, see manifests/external-secrets).
images:
  # newName kept pointing at the REAL, currently-published GitLab registry path
  # (registry.hugmesh.systems/hugmesh/hugmesh-forum-bff-api) — the GitLab
  # group/project has not been renamed yet, so retargeting this to a hugmesh/ path
  # would break every image pull until that migration lands. See PR notes.
  - { name: hugmesh-systems/forum-bff-api, newName: registry.hugmesh.systems/hugmesh/hugmesh-forum-bff-api, newTag: main }
patches:
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: gitlab-registry
