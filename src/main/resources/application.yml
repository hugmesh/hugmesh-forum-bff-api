spring:
  application:
    name: hugmesh-forum-bff-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${CASDOOR_ISSUER_URI:https://id.hugmesh.net}"
          # Explicit JWKS so the resource server does NOT do OIDC discovery against
          # issuer-uri. On the local compose stack the issuer is the PUBLISHED
          # http://localhost:8000 (what the browser token carries in `iss`), but
          # inside a container localhost is the container itself — discovery dials
          # 127.0.0.1:8000, gets connection-refused, and depending on timing every
          # authenticated call answers a bare 401 or a 500 with nothing useful in
          # the logs. mod-bff hit and documented this first; this BFF never copied
          # the fix. iss is still validated via issuer-uri. Compose supplies
          # CASDOOR_JWKS_URI=http://casdoor:8000/.well-known/jwks.
          jwk-set-uri: "${CASDOOR_JWKS_URI:${CASDOOR_ISSUER_URI:https://id.hugmesh.net}/.well-known/jwks}"

  # Runtime data access is REACTIVE (R2DBC) over the forum-bff datastore: the
  # forum_user_role binding cache + the forum_action audit table.
  r2dbc:
    url: "${SPRING_R2DBC_URL:r2dbc:postgresql://forum-bff-db.hugmesh-backend.svc.cluster.local:5432/forumbff}"
    username: "${SPRING_R2DBC_USERNAME:forumbff}"
    password: "${SPRING_R2DBC_PASSWORD:}"

  # Liquibase owns schema migrations. It has NO R2DBC runner, so it uses a plain
  # JDBC datasource — the ONLY JDBC use in the app; all runtime access is R2DBC.
  liquibase:
    enabled: true
    change-log: "classpath:db/changelog/db.changelog-master.xml"
    url: "${SPRING_LIQUIBASE_URL:jdbc:postgresql://forum-bff-db.hugmesh-backend.svc.cluster.local:5432/forumbff}"
    user: "${SPRING_LIQUIBASE_USER:forumbff}"
    password: "${SPRING_LIQUIBASE_PASSWORD:}"

# ── The headless phpBB extension (hugmesh/forum-api) ───────────────────────
# phpBB has NO native REST API: the headless mechanism is the design-chosen thin
# CUSTOM phpBB extension (Symfony controllers/routing.yml + DI-injected phpBB
# services + JsonResponse), reached at the in-cluster phpbb Service DNS in the
# DEDICATED hugmesh-forum default-deny namespace (NOT hugmesh-backend — the
# isolation boundary). phpbb has NO gateway route; this BFF is its only upstream.
#
# GATED STUB-SEAM: phpbb.enabled DEFAULT FALSE — the extension's shape is confirmed/
# pinned (hugmesh-forum-api, phpBB 3.3) but not yet deployed+validated on-cluster,
# so every read returns typed empty/degraded and every write is a no-op (audited
# where applicable), NEVER hard-failing. Flip phpbb.enabled=true (and
# external.forum.enabled=true for the ban congruence) once hugmesh/forum-api is
# validated on-cluster. The caller's Casdoor JWT is forwarded (Bearer +
# X-HugMesh-JWT); the extension validates it against the Casdoor JWKS and
# re-derives group authority — caller-supplied group data is never trusted.
phpbb:
  enabled: "${PHPBB_ENABLED:false}"
  api:
    base-url: "${PHPBB_API_BASE_URL:http://phpbb.hugmesh-forum.svc.cluster.local:80}"

# Ban-by-role-removal CONGRUENCE seam (mirrors the mod-bff MastodonAdminClient
# stub-seam). external.forum.enabled DEFAULT FALSE: the PhpbbAdminClient suspend/
# unsuspend call short-circuits to STUBBED with no HTTP call; when true, it makes the
# real HTTP call against the confirmed phpBB extension admin API shape. Either way the
# action is ALWAYS recorded in the OWN forum_action audit table regardless.
external:
  forum:
    enabled: "${EXTERNAL_FORUM_ENABLED:false}"

resilience4j:
  circuitbreaker:
    instances:
      phpbb:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      phpbb-admin:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

# ── API-to-API mTLS (CLIENT side / OUTBOUND) ─────────────────────────────────
# The OTHER half of the server.ssl.* enforcement below: the gateway->forum-bff and
# forum-bff->phpBB-extension legs. PhpbbHttpClientSsl builds a reactor-netty
# connector that presents this BFF's PKI client identity (keystore.p12) and trusts
# the cluster CA (truststore.p12). It REUSES the same SSL_* env the server-side
# stores use — one mounted /stores layout serves both directions. DEFAULT OFF:
# local/dev/CI (plain http, no stores) is unaffected; the in-cluster deployment sets
# HUGMESH_MTLS_CLIENT_ENABLED=true alongside the server-side SSL_CLIENT_AUTH=need.
hugmesh:
  mtls:
    client:
      enabled: "${HUGMESH_MTLS_CLIENT_ENABLED:false}"
      key-store: "${SSL_KEY_STORE:/stores/keystore.p12}"
      key-store-type: "${SSL_KEY_STORE_TYPE:PKCS12}"
      key-store-password: "${SSL_KEY_STORE_PASSWORD:}"
      trust-store: "${SSL_TRUST_STORE:/stores/truststore.p12}"
      trust-store-type: "${SSL_TRUST_STORE_TYPE:PKCS12}"
      trust-store-password: "${SSL_TRUST_STORE_PASSWORD:}"

# SpringDoc OpenAPI. The spec at /v3/api-docs is the source the platform
# ng-openapi-gen typed client (the paired hugmesh-forum-ui) + the docs pipeline
# consume. Spec + UI are gated by SecurityConfig: permitAll under dev/test (so
# `gen:fetch` can curl the spec without a token) and ROLE_ADMIN otherwise (prod).
springdoc:
  # REQUIRED for the ng-openapi-gen typed client: pin the default response media type
  # to application/json. Without this, springdoc emits `*/*` as the produces media type
  # for handlers that don't declare an explicit one, and ng-openapi-gen maps `*/*` to a
  # Blob response — which breaks JSON parsing in the generated hugmesh-forum-ui
  # client. Endpoints that DO declare an explicit produces (e.g. an octet-stream binary
  # download) keep their own media type; this only sets the default for the rest.
  default-produces-media-type: application/json
  api-docs:
    enabled: true
    path: /v3/api-docs
    # Pin the dumped spec to OpenAPI 3.0.1. springdoc-openapi 3.x (Boot 4) defaults to
    # 3.1.0, which ng-openapi-gen 0.51.0 cannot parse (it chokes on 3.1's `type` arrays:
    # "TypeError: type.startsWith is not a function"). Keep 3.0 for typed-client compat.
    version: openapi_3_0
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  # Restrict the component scan to this BFF's own controllers so the spec stays the
  # forum-BFF surface only (no stray springframework/actuator paths leak in).
  packages-to-scan: net.hugmesh.forumbff

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
  # ── API-to-API mTLS enforcement (server side) ──────────────────────────────
  # When the in-cluster keystore initContainer is mounted (PKCS12 keystore.p12 =
  # this service's Vault-PKI identity + truststore.p12 = the cluster CA), the
  # deployment flips these on so the TLS handshake REQUIRES a client cert that chains
  # to the cluster CA. A caller that was NOT deployed+signed by our Vault/ESO PKI
  # process holds no such cert, so its handshake is rejected.
  #
  # Defaults keep local/dev/CI working: ssl.enabled=false (plaintext) and
  # client-auth=none, so the truststore is never opened and existing tests are
  # unaffected. In-cluster, the deployment sets SSL_ENABLED=true,
  # SSL_CLIENT_AUTH=need and points the key-store/trust-store at the mounted PKCS12
  # stores. The store passwords are generated in-pod and injected via env.
  ssl:
    enabled: "${SSL_ENABLED:false}"
    client-auth: "${SSL_CLIENT_AUTH:none}"
    key-store: "${SSL_KEY_STORE:/stores/keystore.p12}"
    key-store-type: "${SSL_KEY_STORE_TYPE:PKCS12}"
    key-store-password: "${SSL_KEY_STORE_PASSWORD:}"
    trust-store: "${SSL_TRUST_STORE:/stores/truststore.p12}"
    trust-store-type: "${SSL_TRUST_STORE_TYPE:PKCS12}"
    trust-store-password: "${SSL_TRUST_STORE_PASSWORD:}"
    # TLSv1.3 floor (forward-secret, AEAD-only) — matches the gateway chart.
    enabled-protocols: "${SSL_ENABLED_PROTOCOLS:TLSv1.3}"

app:
  # Per-brand Casdoor issuers for multi-tenant mode. OPT-IN: empty = single-issuer.
  # Format: comma-separated issuerUri=domainName pairs.
  # When non-empty, TenancyResourceServerConfig activates; unknown issuers → 401.
  tenancy:
    issuers: "${APP_TENANCY_ISSUERS:}"
